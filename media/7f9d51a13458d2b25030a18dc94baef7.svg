<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="510" height="488" viewBox="0,0,510,488"><defs><linearGradient x1="240" y1="-8.80658" x2="240" y2="368.80658" gradientUnits="userSpaceOnUse" id="color-1"><stop offset="0" stop-color="#0064ff"/><stop offset="1" stop-color="#9300ff"/></linearGradient><linearGradient x1="495" y1="181.75" x2="-13" y2="181.75" gradientUnits="userSpaceOnUse" id="color-2"><stop offset="0" stop-color="#0064ff" stop-opacity="0.58934"/><stop offset="1" stop-color="#ffb600" stop-opacity="0.46774"/></linearGradient></defs><g transform="translate(14,62.25)"><g data-paper-data="{&quot;isPaintingLayer&quot;:true}" fill-rule="nonzero" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" style="mix-blend-mode: normal"><path d="M-8,368.80658v-377.61317h496v377.61317z" fill="url(#color-1)" stroke="#000000" stroke-width="2"/><path d="M-13,-61.25h508v486h-508z" fill="url(#color-2)" stroke="#000000" stroke-width="2"/><text transform="translate(11.5,43.00105) scale(0.80211,0.80211)" font-size="40" xml:space="preserve" fill="#f7faff" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="&quot;ヒラギノ角ゴ Pro W3&quot;, &quot;Hiragino Kaku Gothic Pro&quot;, Osaka, &quot;メイリオ&quot;, Meiryo, &quot;ＭＳ Ｐゴシック&quot;, &quot;MS PGothic&quot;" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">Wait, for sure, nobody knows the</tspan><tspan x="0" dy="48px">point of what I have gone through.</tspan><tspan x="0" dy="48px">But perhaps, I can transfer the</tspan><tspan x="0" dy="48px">skills of teamwork &amp; endurance to</tspan><tspan x="0" dy="48px">real life... Wait, it's all up to you... </tspan><tspan x="0" dy="48px">You can dream big, you can dream</tspan><tspan x="0" dy="48px">small... You can do big, y